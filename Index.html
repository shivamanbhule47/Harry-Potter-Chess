<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MagicChess — Live 3D Wizard Duel</title>
<meta name="description" content="Two AI wizards play live chess in 3D, with clocks, spells and sound.">
<meta name="theme-color" content="#0a0818">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23120d2b'/><path d='M18 3l3 8 8 3-8 3-3 8-3-8-8-3 8-3z' fill='%23ffc866'/><circle cx='8' cy='25' r='3' fill='%238fc4ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--side:300px;--sun:#ffbe55;--moon:#8fc4ff;--ink:#f3ead7;--dim:#a99fc0;--panel:rgba(16,12,34,.78);--line:rgba(214,178,108,.35);
  --title:'Cinzel',Georgia,serif;--body:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07050f;color:var(--ink);font-family:var(--body);font-size:17px}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas#scene:active{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
button,select{font:700 12px var(--title);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;min-height:38px;padding:0 12px;cursor:pointer}
button:hover,select:hover{background:rgba(255,200,102,.16)}
button:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
select{width:100%;background:#1a1438}

#brand{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;pointer-events:none}
#brand h1{font:700 24px var(--title);letter-spacing:.08em;background:linear-gradient(90deg,#fff1c9,var(--sun),var(--moon));-webkit-background-clip:text;background-clip:text;color:transparent}
#brand small{display:block;color:var(--dim);font-size:14px}
#live{font:700 10px var(--title);letter-spacing:.15em;background:#a4163a;border-radius:20px;padding:4px 9px;display:flex;align-items:center;gap:6px}
#live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

#side{position:fixed;right:14px;top:14px;bottom:14px;width:var(--side);display:flex;flex-direction:column;gap:10px}
.player{padding:10px 14px;display:grid;grid-template-columns:42px 1fr auto;column-gap:10px;align-items:center;transition:border-color .3s,box-shadow .3s}
.player svg{width:42px;height:42px;grid-row:span 2}
.player .name{font:700 14px var(--title)}
.player .who{color:var(--dim);font-size:14px;line-height:1.1}
.clock{grid-column:3;grid-row:1/span 2;font:700 25px var(--title);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.clock.low{color:#ff5d6c;animation:blink 1s infinite}
.taken{grid-column:1/-1;min-height:22px;font-size:18px;letter-spacing:-1px;display:flex;flex-wrap:wrap;gap:0 2px;align-items:center}
.taken b{font-size:13px;letter-spacing:0;margin-left:6px;color:var(--dim)}
#p0.active{border-color:var(--sun);box-shadow:0 0 22px rgba(255,190,85,.4)}
#p1.active{border-color:var(--moon);box-shadow:0 0 22px rgba(143,196,255,.4)}
#p0 .name{color:var(--sun)} #p1 .name{color:var(--moon)}

#record{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px}
#times{display:flex;justify-content:space-between;color:var(--dim);font-size:15px;margin-bottom:8px}
#times b{color:var(--ink);font-variant-numeric:tabular-nums}
#evalbar{height:8px;border-radius:6px;background:linear-gradient(90deg,#26305f,#4a64b0);overflow:hidden;margin-bottom:8px}
#evalfill{height:100%;width:50%;background:linear-gradient(90deg,#c67a16,#ffd27a);transition:width .6s}
#moves{flex:1;overflow-y:auto;display:grid;grid-template-columns:34px 1fr 1fr;align-content:start;row-gap:2px;font-size:17px;scrollbar-width:thin}
#moves span{padding:1px 6px;border-radius:5px}
#moves .n{color:var(--dim)} #moves .last{background:rgba(255,200,102,.2)}

#controls{padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#controls button{padding:0 4px}
#settings{position:fixed;right:calc(var(--side) + 26px);bottom:14px;width:250px;padding:14px;display:none;gap:9px;z-index:5}
#settings.open{display:grid}
#settings label{display:grid;grid-template-columns:105px 1fr;align-items:center;color:var(--dim)}

#caption{position:fixed;left:calc(50% - var(--side) / 2 - 7px);bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 20px;font-size:19px;font-style:italic;text-align:center;width:max-content;max-width:min(560px,calc(100vw - var(--side) - 50px));pointer-events:none}
#banner{position:fixed;left:calc(50% - var(--side) / 2 - 7px);top:17%;transform:translate(-50%,-10px) scale(.9);font:700 clamp(28px,5vw,54px) var(--title);color:#ffe3a3;text-shadow:0 0 18px #ff7b2f,0 0 40px #8a2be2;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
#result{position:fixed;left:calc(50% - var(--side) / 2 - 7px);top:50%;transform:translate(-50%,-50%);padding:24px 30px;text-align:center;display:none;width:min(390px,calc(100vw - 32px));z-index:4}
#result.show{display:block}
#result h2{font:700 26px var(--title);color:#ffe3a3}
#result p{font-size:19px;color:var(--dim);margin:6px 0 14px}
#result button{margin:0 4px}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#07050f;z-index:20;padding:24px;font:700 18px var(--title)}
#loading.done{display:none}
#show{position:fixed;right:12px;top:12px;display:none;opacity:.45}

body.clean #side,body.clean #settings,body.clean #brand small{display:none}
body.clean #caption,body.clean #banner,body.clean #result{left:50%}
body.clean #show{display:block}
body.clean #mini{display:flex}
#mini{display:none;position:fixed;left:50%;transform:translateX(-50%);top:70px;gap:14px;font:700 18px var(--title);padding:7px 18px;white-space:nowrap;font-variant-numeric:tabular-nums}
#mini .a{color:var(--sun)} #mini .b{color:var(--moon)}

@media (max-width:860px) and (orientation:portrait){
  html,body{font-size:15px}
  #brand{left:12px;top:calc(8px + env(safe-area-inset-top))}
  #brand h1{font-size:18px} #brand small{display:none}
  #side{display:contents}
  .player{position:fixed;top:calc(44px + env(safe-area-inset-top));width:calc(50% - 15px);padding:7px 9px;grid-template-columns:1fr;row-gap:0}
  #p0{left:10px} #p1{right:10px}
  .player svg{display:none}
  .player .who{font-size:13px}
  .clock{grid-column:1;grid-row:auto;text-align:left;font-size:23px}
  .taken{font-size:14px;min-height:18px}
  #record{position:fixed;left:10px;right:10px;bottom:calc(108px + env(safe-area-inset-bottom));height:92px;flex:none;padding:7px 10px}
  #times{font-size:13px;margin-bottom:5px}
  #evalbar{margin-bottom:5px;flex:none;height:5px}
  #moves{font-size:14px}
  #controls{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}
  #settings{right:10px;left:10px;width:auto;bottom:calc(108px + env(safe-area-inset-bottom))}
  #caption{left:50%;bottom:calc(208px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px);font-size:15px;padding:5px 12px}
  #banner,#result{left:50%}
  #banner{top:24%}
  body.clean .player,body.clean #record,body.clean #controls{display:none}
  body.clean #caption{bottom:20px}
}
@media (max-width:1000px) and (orientation:landscape){
  :root{--side:236px}
  html,body{font-size:15px}
  .player{grid-template-columns:1fr auto;padding:6px 10px} .player svg{display:none}
  .clock{grid-column:2;font-size:20px;min-width:0}
  #brand small{display:none} #brand h1{font-size:18px}
  #caption{font-size:15px}
}
@media (max-height:620px) and (orientation:landscape){
  #side{top:8px;bottom:8px;gap:6px}
  .taken{display:none} .player{padding-top:4px;padding-bottom:4px}
  #record{padding:6px 10px} #times{font-size:13px;margin-bottom:4px}
  #controls{padding:6px;gap:5px} #controls button{min-height:32px;font-size:10px}
  #settings{bottom:8px;padding:10px;gap:5px;max-height:calc(100% - 16px);overflow:auto}
}
@media (prefers-reduced-motion:reduce){#live i,.clock.low{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D chess board"></canvas>

<div id="brand">
  <div><h1>MagicChess</h1><small>The Enchanted Hall · <span id="gameNo">Duel 1</span></small></div>
  <div id="live"><i></i>LIVE</div>
</div>
<div id="mini" class="panel"><span class="a" id="mini0">05:00</span><span>⚔</span><span class="b" id="mini1">05:00</span></div>
<button id="show">Show panels</button>

<aside id="side">
  <section class="player panel" id="p1">
    <svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="20" fill="#18204a" stroke="#8fc4ff" stroke-width="1.5"/><path d="M27 9a13 13 0 1 0 5 21A11 11 0 0 1 27 9z" fill="#bcdcff"/><circle cx="30" cy="16" r="1.6" fill="#fff"/></svg>
    <div class="name">Moonshadow <span id="score1">0</span></div>
    <div class="who" id="who1">Archmage</div>
    <div class="clock" id="clock1">05:00</div>
    <div class="taken" id="taken1"></div>
  </section>
  <section class="panel" id="record">
    <div id="times"><span>Match <b id="matchTime">00:00</b></span><span>This move <b id="moveTime">0.0s</b></span></div>
    <div id="evalbar" title="Advantage: gold is Sunfire, blue is Moonshadow"><div id="evalfill"></div></div>
    <div id="moves" aria-live="off"></div>
  </section>
  <section class="player panel" id="p0">
    <svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="20" fill="#4a2208" stroke="#ffbe55" stroke-width="1.5"/><circle cx="21" cy="21" r="7" fill="#ffd27a"/><path d="M21 5v6M21 31v6M5 21h6M31 21h6M10 10l4 4M28 28l4 4M32 10l-4 4M14 28l-4 4" stroke="#ffd27a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="name">Sunfire <span id="score0">0</span></div>
    <div class="who" id="who0">Archmage</div>
    <div class="clock" id="clock0">05:00</div>
    <div class="taken" id="taken0"></div>
  </section>
  <nav class="panel" id="controls">
    <button id="pause">Pause</button>
    <button id="restart">New duel</button>
    <button id="speed">Speed 1×</button>
    <button id="camera">Cam: Orbit</button>
    <button id="sound">Sound: tap</button>
    <button id="gear" aria-expanded="false">Settings</button>
  </nav>
</aside>

<div class="panel" id="settings">
  <label>Game clock<select id="time">
    <option value="60+1">1 min + 1s</option><option value="180+2">3 min + 2s</option>
    <option value="300+3" selected>5 min + 3s</option><option value="600+5">10 min + 5s</option></select></label>
  <label>Sunfire<select id="level0"><option value="0">Apprentice</option><option value="1">Adept</option><option value="2" selected>Archmage</option></select></label>
  <label>Moonshadow<select id="level1"><option value="0">Apprentice</option><option value="1">Adept</option><option value="2" selected>Archmage</option></select></label>
  <label>Next duel<select id="auto"><option value="1" selected>Auto start</option><option value="0">Manual</option></select></label>
  <button id="full">Full screen</button>
  <button id="hide">Hide panels (stream mode)</button>
</div>

<div id="banner" role="status"></div>
<div id="caption" class="panel">The candles are lit…</div>
<div id="result" class="panel">
  <h2 id="resultTitle"></h2><p id="resultText"></p>
  <button id="again">Start next duel</button><button id="view">View board</button>
</div>
<div id="loading"><div>✦ Summoning the Enchanted Hall ✦</div><div id="loadnote" style="font:500 17px var(--body);color:var(--dim)">Loading 3D magic…</div></div>

<script id="engine-src">
/* ===== CHESS ENGINE (rules + AI). Runs on the page and inside a Web Worker ===== */
const Engine = (() => {
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const CHARS = ' pnbrqk';
  const STEP_N = [31, 33, 14, 18, -31, -33, -14, -18];
  const STEP_B = [15, 17, -15, -17];
  const STEP_R = [1, -1, 16, -16];
  const STEP_K = STEP_B.concat(STEP_R);
  const CASTLE_MASK = new Array(128).fill(15);
  CASTLE_MASK[0] = 13; CASTLE_MASK[4] = 12; CASTLE_MASK[7] = 14;
  CASTLE_MASK[112] = 7; CASTLE_MASK[116] = 3; CASTLE_MASK[119] = 11;

  function fromFEN(fen) {
    const [rows, side, castle, ep, half, full] = fen.split(' ');
    const s = { b: new Array(128).fill(0), side: side === 'b' ? 1 : 0, castle: 0, ep: -1,
      half: +half || 0, full: +full || 1, king: [-1, -1] };
    rows.split('/').forEach((row, i) => {
      let f = 0;
      for (const ch of row) {
        if (ch >= '1' && ch <= '8') { f += +ch; continue; }
        const type = CHARS.indexOf(ch.toLowerCase());
        const color = ch === ch.toLowerCase() ? 1 : 0;
        const sq = (7 - i) * 16 + f++;
        s.b[sq] = type | (color << 3);
        if (type === K) s.king[color] = sq;
      }
    });
    if (castle.includes('K')) s.castle |= 1;
    if (castle.includes('Q')) s.castle |= 2;
    if (castle.includes('k')) s.castle |= 4;
    if (castle.includes('q')) s.castle |= 8;
    if (ep && ep !== '-') s.ep = (+ep[1] - 1) * 16 + ep.charCodeAt(0) - 97;
    return s;
  }

  function attacked(s, sq, by) {
    const b = s.b, c = by << 3;
    const pawnDir = by === 0 ? -16 : 16;
    for (const d of [pawnDir - 1, pawnDir + 1]) {
      const t = sq + d;
      if (!(t & 0x88) && b[t] === (P | c)) return true;
    }
    for (const d of STEP_N) { const t = sq + d; if (!(t & 0x88) && b[t] === (N | c)) return true; }
    for (const d of STEP_K) { const t = sq + d; if (!(t & 0x88) && b[t] === (K | c)) return true; }
    for (const d of STEP_B) {
      for (let t = sq + d; !(t & 0x88); t += d) {
        const p = b[t];
        if (p) { if (p === (B | c) || p === (Q | c)) return true; break; }
      }
    }
    for (const d of STEP_R) {
      for (let t = sq + d; !(t & 0x88); t += d) {
        const p = b[t];
        if (p) { if (p === (R | c) || p === (Q | c)) return true; break; }
      }
    }
    return false;
  }

  const inCheck = (s, side = s.side) => attacked(s, s.king[side], side ^ 1);

  function pseudo(s, capturesOnly) {
    const out = [], b = s.b, us = s.side;
    const add = (f, t, p, c, fl = 0) => out.push({ f, t, p, c, pr: 0, fl });
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq];
      if (!p || (p >> 3) !== us) continue;
      const type = p & 7;
      if (type === P) {
        const dir = us === 0 ? 16 : -16, startRank = us === 0 ? 1 : 6, lastRank = us === 0 ? 7 : 0;
        const pawnAdd = (t, c, fl) => {
          if ((t >> 4) === lastRank) for (const pr of [Q, R, B, N]) out.push({ f: sq, t, p, c, pr, fl });
          else add(sq, t, p, c, fl);
        };
        const one = sq + dir;
        if (!b[one] && (!capturesOnly || (one >> 4) === lastRank)) {
          pawnAdd(one, 0, 0);
          if ((sq >> 4) === startRank && !b[one + dir] && !capturesOnly) add(sq, one + dir, p, 0, 8);
        }
        for (const d of [dir - 1, dir + 1]) {
          const t = sq + d;
          if (t & 0x88) continue;
          if (b[t] && (b[t] >> 3) !== us) pawnAdd(t, b[t], 0);
          else if (t === s.ep) add(sq, t, p, P | ((us ^ 1) << 3), 1);
        }
        continue;
      }
      const steps = type === N ? STEP_N : type === B ? STEP_B : type === R ? STEP_R : STEP_K;
      const slides = type === B || type === R || type === Q;
      for (const d of steps) {
        for (let t = sq + d; !(t & 0x88); t += d) {
          const q = b[t];
          if (q) { if ((q >> 3) !== us) add(sq, t, p, q); break; }
          if (!capturesOnly) add(sq, t, p, 0);
          if (!slides) break;
        }
      }
      if (type === K && !capturesOnly) {
        const home = us === 0 ? 4 : 116, them = us ^ 1, rook = R | (us << 3);
        if (sq === home && !attacked(s, home, them)) {
          if ((s.castle & (us === 0 ? 1 : 4)) && b[home + 3] === rook && !b[home + 1] && !b[home + 2] &&
              !attacked(s, home + 1, them) && !attacked(s, home + 2, them)) add(sq, home + 2, p, 0, 2);
          if ((s.castle & (us === 0 ? 2 : 8)) && b[home - 4] === rook && !b[home - 1] && !b[home - 2] && !b[home - 3] &&
              !attacked(s, home - 1, them) && !attacked(s, home - 2, them)) add(sq, home - 2, p, 0, 4);
        }
      }
    }
    return out;
  }

  function make(s, m) {
    const b = s.b, us = s.side;
    const undo = { castle: s.castle, ep: s.ep, half: s.half };
    b[m.t] = m.pr ? (m.pr | (us << 3)) : m.p;
    b[m.f] = 0;
    if (m.fl & 1) b[m.t + (us === 0 ? -16 : 16)] = 0;
    if (m.fl & 2) { b[m.t - 1] = b[m.t + 1]; b[m.t + 1] = 0; }
    if (m.fl & 4) { b[m.t + 1] = b[m.t - 2]; b[m.t - 2] = 0; }
    if ((m.p & 7) === K) s.king[us] = m.t;
    s.castle &= CASTLE_MASK[m.f] & CASTLE_MASK[m.t];
    s.ep = (m.fl & 8) ? (m.f + m.t) >> 1 : -1;
    s.half = ((m.p & 7) === P || m.c) ? 0 : s.half + 1;
    if (us === 1) s.full++;
    s.side ^= 1;
    return undo;
  }

  function unmake(s, m, u) {
    s.side ^= 1;
    const b = s.b, us = s.side;
    b[m.f] = m.p;
    b[m.t] = (m.fl & 1) ? 0 : m.c;
    if (m.fl & 1) b[m.t + (us === 0 ? -16 : 16)] = m.c;
    if (m.fl & 2) { b[m.t + 1] = b[m.t - 1]; b[m.t - 1] = 0; }
    if (m.fl & 4) { b[m.t - 2] = b[m.t + 1]; b[m.t + 1] = 0; }
    if ((m.p & 7) === K) s.king[us] = m.f;
    s.castle = u.castle; s.ep = u.ep; s.half = u.half;
    if (us === 1) s.full--;
  }

  function legal(s, capturesOnly = false) {
    const us = s.side;
    return pseudo(s, capturesOnly).filter(m => {
      const u = make(s, m);
      const ok = !attacked(s, s.king[us], us ^ 1);
      unmake(s, m, u);
      return ok;
    });
  }

  function key(s) {
    let ep = -1;
    if (s.ep >= 0 && legal(s, true).some(m => m.fl & 1)) ep = s.ep;
    return s.b.join('') + '|' + s.side + s.castle + '|' + ep;
  }

  function insufficient(s) {
    const minor = [];
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) continue;
      const type = s.b[sq] & 7;
      if (!type || type === K) continue;
      if (type === P || type === R || type === Q) return false;
      minor.push({ type, shade: ((sq >> 4) + (sq & 7)) & 1 });
    }
    return minor.length <= 1 || minor.every(m => m.type === B && m.shade === minor[0].shade);
  }

  /* ---------- evaluation ---------- */
  const VAL = [0, 100, 320, 335, 500, 900, 0];
  // tables are written from White's side, rank 8 first
  const PST = [null,
    [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5,
     0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30,
     -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],

      const p = curve.getPoint(t * t);
      orb.position.copy(p); core.position.copy(p); spellLight.position.copy(p); spellLight.intensity = 45;
      for (let i = 0; i < 5; i++) particle(p.clone().add(randomDir().multiplyScalar(.08)), color, rand(.15, .45), rand(.2, .65), randomDir().multiplyScalar(.5));
    });
    fx.remove(orb, core); orb.material.dispose(); core.material.dispose();
  }
  spellLight.intensity = 90;
}

/* ================= game state ================= */
const engineSource = $('engine-src').textContent;
let worker = null, requestId = 0;
const pending = new Map();
function useFallback() {
  worker = null;
  for (const [id, job] of pending) setTimeout(() => { pending.delete(id); job.resolve(Engine.search(job.state, job.opts)); }, 30);
}
try {
  worker = new Worker(URL.createObjectURL(new Blob([engineSource], { type: 'text/javascript' })));
  worker.onmessage = e => { const job = pending.get(e.data.id); if (job) { pending.delete(e.data.id); job.resolve(e.data.result); } };
  worker.onerror = useFallback;
} catch (e) { worker = null; }
function askAI(state, opts) {
  return new Promise(resolve => {
    const id = ++requestId; pending.set(id, { resolve, state, opts });
    if (worker) worker.postMessage({ id, state, opts }); else useFallback();
  });
}

const LEVELS = [
  { name: 'Apprentice', depth: 2, ms: 300, margin: 35 },
  { name: 'Adept', depth: 3, ms: 700, margin: 15 },
  { name: 'Archmage', depth: 5, ms: 1600, margin: 7 }
];
const store = {
  get() { try { return JSON.parse(localStorage.getItem('magicchess')) || {}; } catch (e) { return {}; } },
  save() { try { localStorage.setItem('magicchess', JSON.stringify({ time: $('time').value, l0: $('level0').value, l1: $('level1').value, auto: $('auto').value, score, speed })); } catch (e) {} }
};
const saved = store.get();
const score = Array.isArray(saved.score) ? saved.score : [0, 0];
if (saved.time) $('time').value = saved.time;
if (saved.l0) $('level0').value = saved.l0;
if (saved.l1) $('level1').value = saved.l1;
if (saved.auto) $('auto').value = saved.auto;
if ([.5, 1, 2, 4].includes(saved.speed)) speed = saved.speed;

let game, gameCount = 0;
const pieces = new Map(); // square -> mesh
const GLYPH = ['', '♟', '♞', '♝', '♜', '♛', '♚'];
const fmt = s => { s = Math.max(0, s); if (s < 20) return s.toFixed(1); const t = Math.ceil(s); return String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const say = text => { $('caption').textContent = text; };
let bannerTimer;
function banner(text) { $('banner').textContent = text; $('banner').classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 1800); }

function newGame() {
  const gen = ++generation;
  tweens.length = 0; pending.clear();
  pieces.forEach(p => scene.remove(p)); pieces.clear();
  scene.children.filter(o => o.userData.type).forEach(o => scene.remove(o));
  fx.clear(); debris.length = rings.length = 0;
  const [base, inc] = $('time').value.split('+').map(Number);
  const state = Engine.fromFEN(Engine.START);
  game = { state, clock: [base, base], inc, elapsed: 0, moveTime: 0, thinking: false, over: false, plies: 0,
    seen: new Map([[Engine.key(state), 1]]), taken: [[], []], levels: [+$('level0').value, +$('level1').value], eval: 0 };
  for (let sq = 0; sq < 120; sq++) {
    if (sq & 0x88 || !state.b[sq]) continue;
    const p = makePiece(state.b[sq] & 7, state.b[sq] >> 3);
    p.position.copy(worldOf(sq)); p.visible = false; scene.add(p); pieces.set(sq, p);
  }
  gameCount++;
  $('gameNo').textContent = 'Duel ' + gameCount;
  $('moves').textContent = ''; $('result').classList.remove('show');
  for (const m of [...marks, checkRing]) m.visible = false;
  for (const c of [0, 1]) $('who' + c).textContent = LEVELS[game.levels[c]].name + ' AI';
  refreshHUD();
  run(gen, game);
}

async function run(gen, g) {
  say('The pieces awaken…');
  [...pieces].forEach(([sq, p]) => {
    const home = worldOf(sq), delay = ((sq & 7) * .07 + (p.userData.color ? .25 : 0) + (p.userData.type === 1 ? .15 : 0));
    p.position.set(home.x, 5, home.z);
    tween(delay + .8, t => {
      const k = Math.max(0, (t * (delay + .8) - delay) / .8);
      p.visible = k > 0; p.position.y = 5 * Math.pow(1 - k, 3);
      if (k > 0 && k < .9) particle(p.position.clone().add(V(0, .5, 0)), COLORS[p.userData.color], .25, .4);
    });
  });
  await tween(2.1);
  if (gen !== generation) return;
  say('Sunfire to move. Let the duel begin!'); banner('Duel ' + gameCount);

  while (gen === generation && !g.over) {
    const s = g.state, side = s.side, level = LEVELS[g.levels[side]];
    g.thinking = true; g.moveTime = 0; refreshHUD();
    // spend less time when the clock runs low
    const budget = Math.max(40, Math.min(level.ms, g.clock[side] * 1000 / 30));
    const pause = Math.min(rand(.7, 2.4), Math.max(.05, g.clock[side] / 25) * speed);
    const [res] = await Promise.all([
      askAI(s, { depth: level.depth, ms: budget, margin: s.full <= 6 ? level.margin + 25 : level.margin, seen: [...g.seen.keys()] }),
      tween(pause)
    ]);
    await tween(.001); // hold the move while paused
    if (gen !== generation || g.over) return;
    g.thinking = false;
    g.clock[side] += g.inc; g.eval = res.score;
    await playMove(gen, g, res.move);
    if (gen !== generation) return;
    const verdict = judge(g);
    if (verdict) return finish(gen, g, ...verdict);
  }
}

async function playMove(gen, g, m) {
  const s = g.state, side = s.side, type = m.p & 7, text = Engine.san(s, m);
  const piece = pieces.get(m.f), dest = worldOf(m.t);
  const victimSq = m.c ? ((m.fl & 1) ? m.t + (side ? 16 : -16) : m.t) : -1;
  const victim = victimSq >= 0 ? pieces.get(victimSq) : null;
  marks[0].position.set(worldOf(m.f).x, .008, worldOf(m.f).z); marks[1].position.set(dest.x, .008, dest.z);
  marks.forEach(x => { x.visible = true; x.material.color.set(COLORS[side]); });
  checkRing.visible = false;
  const where = Engine.name(m.t);
  say(victim ? `${NAMES[side]} ${PIECE_NAMES[type]} strikes the ${PIECE_NAMES[m.c & 7]} on ${where}!`
    : (m.fl & 6) ? `${NAMES[side]} castles — the Archmage takes shelter.` : `${NAMES[side]} ${PIECE_NAMES[type]} glides to ${where}.`);
  sfx.lift();
  if (victim) {
    pieces.delete(victimSq);
    if (type === 2) { // knight pounces
      await glide(piece, dest, 2.6, .85);
      if (gen !== generation) return;
      shatter(victim);
    } else {
      await castSpell(piece, victim);
      if (gen !== generation) return;
      shatter(victim);
      await tween(.45);
      await glide(piece, dest, type === 1 ? .35 : .55, .6);
    }
    g.taken[side].push(m.c & 7);
  } else if (m.fl & 6) {
    const rf = (m.fl & 2) ? m.t + 1 : m.t - 2, rt = (m.fl & 2) ? m.t - 1 : m.t + 1, rook = pieces.get(rf);
    pieces.delete(rf); pieces.set(rt, rook);
    await Promise.all([glide(piece, dest, .3, .9), glide(rook, worldOf(rt), 1.9, .9)]);
  } else {
    await glide(piece, dest, type === 2 ? 1.8 : .45, .45 + Math.hypot(dest.x - piece.position.x, dest.z - piece.position.z) * .08);
  }
  if (gen !== generation) return;
  sfx.land(); burst(dest.clone().setY(.08), COLORS[side], 18, 1.6, .16, 1);
  pieces.delete(m.f); pieces.set(m.t, piece);
  if (m.pr) {
    scene.remove(piece);
    const fresh = makePiece(m.pr, side); fresh.position.copy(dest); scene.add(fresh); pieces.set(m.t, fresh);
    burst(dest.clone().setY(.8), COLORS[side], 160, 4.5, .3, 0); shockwave(dest, 0xffffff, 4); sfx.win();
    banner('Transformation!');
  }
  Engine.make(s, m); g.plies++;
  const k = Engine.key(s); g.seen.set(k, (g.seen.get(k) || 0) + 1);
  logMove(g, text);
  if (Engine.inCheck(s)) {
    const kp = worldOf(s.king[s.side]);
    checkRing.position.set(kp.x, .02, kp.z); checkRing.visible = true;
    if (Engine.legal(s).length) { banner('Check!'); sfx.check(); }
  }
  refreshHUD();
  await tween(.3);
}

function logMove(g, text) {
  const box = $('moves'); box.querySelector('.last')?.classList.remove('last');
  if (g.plies % 2 === 1) { const n = document.createElement('span'); n.className = 'n'; n.textContent = Math.ceil(g.plies / 2) + '.'; box.append(n); }
  const e = document.createElement('span'); e.textContent = text; e.className = 'last'; box.append(e);
  box.scrollTop = box.scrollHeight;
}

function judge(g) {
  const s = g.state;
  if (!Engine.legal(s).length) return Engine.inCheck(s) ? [s.side ^ 1, 'by checkmate'] : [-1, 'Stalemate — no legal move remains.'];
  if (Engine.insufficient(s)) return [-1, 'Neither side has enough pieces to checkmate.'];
  if (g.seen.get(Engine.key(s)) >= 3) return [-1, 'The same position appeared three times.'];
  if (s.half >= 100) return [-1, 'Fifty moves passed without a capture or pawn move.'];
  if (g.plies >= 400) return [-1, 'The candles burned out after 200 moves.'];
  return null;
}

async function finish(gen, g, winner, reason) {
  g.over = true; g.thinking = false;
  const mate = reason === 'by checkmate';
  if (winner >= 0) { score[winner]++; g.eval = winner ? -10000 : 10000; } else { score[0] += .5; score[1] += .5; g.eval = 0; }
  store.save(); refreshHUD();
  if (mate) {
    banner('Checkmate!'); sfx.check();
    const king = pieces.get(g.state.king[winner ^ 1]);
    await tween(.8);
    sfx.zap(); burst(king.position.clone().setY(1), COLORS[winner], 130, 5, .3);
    await tween(1.1, t => { king.rotation.z = ease(t) * 1.45; king.position.y = Math.sin(t * Math.PI) * .35 + t * .22; });
    shockwave(king.position, COLORS[winner], 7); shake = .3; sfx.shatter();
  }
  if (gen !== generation) return;
  const title = winner < 0 ? 'The duel is drawn' : NAMES[winner] + ' wins';
  const text = winner < 0 ? reason : mate ? `Checkmate on move ${Math.ceil(g.plies / 2)}.` : reason;
  say(title + '. ' + text);
  if (winner >= 0) {
    sfx.win();
    for (let i = 0; i < 9; i++) { // fireworks
      await tween(.3);
      if (gen !== generation) return;
      const p = V(rand(-6, 6), rand(3, 7), rand(-6, 6));
      burst(p, i % 3 ? COLORS[winner] : 0xff6bd6, 130, 5, .32, 2.2); spellLight.color.set(COLORS[winner]); spellLight.position.copy(p); spellLight.intensity = 60; sfx.boom();
    }
  } else sfx.draw();
  await tween(.6);
  if (gen !== generation) return;
  $('resultTitle').textContent = title; $('result').classList.add('show');
  for (let n = 12; n > 0; n--) {
    const auto = $('auto').value === '1' && !g.hold;
    $('resultText').textContent = auto ? `${text} Next duel in ${n}s.` : text;
    await tween(speed); // one real second at any speed
    if (gen !== generation) return;
    if (!auto) n = 13;
  }
  newGame();
}

function refreshHUD() {
  const g = game; if (!g) return;
  for (const c of [0, 1]) {
    $('score' + c).textContent = '· ' + score[c];
    $('p' + c).classList.toggle('active', !g.over && g.state.side === c);
    const worth = [0, 1, 3, 3, 5, 9, 0], lead = g.taken[c].reduce((a, t) => a + worth[t], 0) - g.taken[c ^ 1].reduce((a, t) => a + worth[t], 0);
    const el = $('taken' + c);
    el.textContent = g.taken[c].slice().sort((a, b) => b - a).map(t => GLYPH[t] + '︎').join('');
    el.style.color = c ? '#ffbe55' : '#8fc4ff';
    if (lead > 0) { const b = document.createElement('b'); b.textContent = '+' + lead; el.append(b); }
  }
  $('evalfill').style.width = (50 + 50 * Math.tanh(g.eval / 500)) + '%';
}
let lastTick = -1;
function updateClocks(dt) {
  const g = game; if (!g) return;
  if (!paused && !g.over && g.plies + (g.thinking ? 1 : 0) > 0) g.elapsed += dt;
  if (g.thinking && !paused && !g.over) {
    const side = g.state.side;
    g.clock[side] -= dt; g.moveTime += dt;
    const sec = Math.ceil(g.clock[side]);
    if (sec <= 10 && sec > 0 && sec !== lastTick) { lastTick = sec; sfx.tick(); }
    if (g.clock[side] <= 0) {
      g.clock[side] = 0;
      const gen = ++generation; tweens.length = 0; pending.clear(); banner("Time's up!");
      // a flag fall is a draw if the opponent cannot possibly checkmate
      const mine = g.state.b.filter((p, i) => !(i & 0x88) && p && (p >> 3) !== side && (p & 7) !== 6).map(p => p & 7);
      const bare = !mine.length || (mine.length === 1 && (mine[0] === 2 || mine[0] === 3));
      finish(gen, g, bare ? -1 : side ^ 1, bare ? 'Time ran out, but the opponent cannot checkmate.' : `${NAMES[side]} ran out of time.`);
    }
  }
  for (const c of [0, 1]) {
    const text = fmt(g.clock[c]);
    if ($('clock' + c).textContent !== text) $('clock' + c).textContent = $('mini' + c).textContent = text;
    $('clock' + c).classList.toggle('low', g.clock[c] < 20 && !g.over);
  }
  const t = g.elapsed | 0;
  $('matchTime').textContent = String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  $('moveTime').textContent = g.moveTime.toFixed(1) + 's';
}

/* ================= camera ================= */
const CAMS = ['Orbit', 'Sunfire', 'Moon', 'Top'];
let camMode = 0, theta = .5, phi = .84, zoom = 1, userTheta = 0, userPhi = 0, orbitClock = 0;
const pointers = new Map(); let pinch = 0, lastInput = -10, now = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; $('settings').classList.remove('open'); });
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]); lastInput = now;
  if (pointers.size === 1) {
    userTheta -= (e.clientX - prev[0]) * .007;
    userPhi = Math.max(-1.2, Math.min(1.2, userPhi - (e.clientY - prev[1]) * .005));
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoom = Math.max(.55, Math.min(1.6, zoom * pinch / d));
    pinch = d;
  }
});
for (const t of ['pointerup', 'pointercancel']) canvas.addEventListener(t, e => { pointers.delete(e.pointerId); pinch = 0; });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.55, Math.min(1.6, zoom * (1 + Math.sign(e.deltaY) * .08))); }, { passive: false });

let fitRadius = 15;
function resize() {
  const w = innerWidth, h = innerHeight, wide = !matchMedia('(max-width:860px) and (orientation:portrait)').matches, clean = document.body.classList.contains('clean');
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the board centred in the space not covered by panels
  const usableW = wide && !clean ? w - $('p0').offsetWidth - 14 : w;
  const top = wide || clean ? 0 : 140, bottom = wide || clean ? 0 : 240;
  const usableH = Math.max(220, h - top - bottom - (wide ? 40 : 0));
  camera.fov = w < h ? 50 : 42;
  if (!wide || !clean) camera.setViewOffset(w, h, (w - usableW) / 2, (bottom - top) / 2 + (wide ? h * .06 : 0), w, h); else camera.clearViewOffset();
  const tan = Math.tan(camera.fov * Math.PI / 360);
  fitRadius = Math.max(6.5 / (tan * usableW / h), 6.3 / (tan * usableH / h), 14);
  camera.updateProjectionMatrix();
  pMat.uniforms.scale.value = h * renderer.getPixelRatio() / (2 * tan);
}
addEventListener('resize', resize);
function updateCamera(dt) {
  if (camMode === 0 && !paused && now - lastInput > 4) orbitClock += dt;
  const target = [
    [Math.sin(orbitClock * .055) * 1.35 + .25, .86 + .32 * Math.pow(Math.max(0, Math.sin(orbitClock * .075 - .6)), 4)], // dips now and then to show the hall
    [0, .78], [Math.PI, .78], [0, .06]
  ][camMode];
  const wantTheta = target[0] + userTheta, wantPhi = Math.max(.05, Math.min(1.38, target[1] + userPhi));
  const k = 1 - Math.exp(-dt * (pointers.size ? 14 : 3.5));
  theta += Math.atan2(Math.sin(wantTheta - theta), Math.cos(wantTheta - theta)) * k;
  phi += (wantPhi - phi) * k;
  const r = Math.min(40, fitRadius * zoom);
  camera.position.set(Math.sin(theta) * Math.sin(phi) * r, Math.cos(phi) * r + .2, Math.cos(theta) * Math.sin(phi) * r);
  shake *= Math.exp(-dt * 7);
  if (shake > .004) camera.position.add(randomDir().multiplyScalar(shake));
  camera.lookAt(0, .25, 0);
  scene.fog.density = .011 * Math.min(1, 16 / r);
}

/* ================= controls ================= */
function setCamera(i) { camMode = i; userTheta = userPhi = 0; zoom = 1; $('camera').textContent = 'Cam: ' + CAMS[i]; }
function togglePause() { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; $('live').style.opacity = paused ? .4 : 1; }
function cycleSpeed() { speed = { .5: 1, 1: 2, 2: 4, 4: .5 }[speed]; $('speed').textContent = `Speed ${speed}×`; store.save(); }
function toggleClean() { document.body.classList.toggle('clean'); $('settings').classList.remove('open'); resize(); }
$('pause').onclick = togglePause;
$('restart').onclick = newGame;
$('again').onclick = newGame;
$('view').onclick = () => { game.hold = true; $('result').classList.remove('show'); say('Press “New duel” to play again.'); };
$('speed').onclick = cycleSpeed;
$('speed').textContent = `Speed ${speed}×`;
$('camera').onclick = () => setCamera((camMode + 1) % CAMS.length);
$('sound').onclick = () => { sfx.toggle(); setTimeout(soundLabel, 120); };
function soundLabel() { $('sound').textContent = !sfx.on ? 'Sound: off' : sfx.ready ? 'Sound: on' : 'Sound: tap'; }
addEventListener('pointerdown', e => { if (e.target.id !== 'sound') { sfx.unlock(); setTimeout(soundLabel, 120); } });
$('gear').onclick = () => { const open = $('settings').classList.toggle('open'); $('gear').setAttribute('aria-expanded', open); };
for (const id of ['time', 'level0', 'level1']) $(id).onchange = () => { store.save(); $('settings').classList.remove('open'); newGame(); };
$('auto').onchange = () => store.save();
$('hide').onclick = toggleClean;
$('show').onclick = toggleClean;
$('full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
addEventListener('keydown', e => {
  if (/SELECT|BUTTON/.test(e.target.tagName) && e.code === 'Space') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyN') newGame();
  else if (e.code === 'KeyC') setCamera((camMode + 1) % CAMS.length);
  else if (e.code === 'KeyS') cycleSpeed();
  else if (e.code === 'KeyH') toggleClean();
  else if (e.code === 'KeyF') $('full').click();
  else if (e.code === 'KeyM') { sfx.toggle(); setTimeout(soundLabel, 120); }
});

/* ================= main loop ================= */
const timer = new THREE.Clock();
function frame() {
  const real = timer.getDelta(), dt = Math.min(real, .05); now += dt;
  updateClocks(Math.min(real, .5));
  updateTweens(Math.min(real, .25));
  const effectDt = paused ? 0 : dt * Math.max(1, speed * .75);
  updateParticles(effectDt); updateEffects(effectDt); updateCamera(dt);
  sky.material.uniforms.time.value = now;
  magicCircle.rotation.z = now * .05;
  if (checkRing.visible) { checkRing.rotation.z = -now * 1.5; checkRing.material.opacity = .65 + Math.sin(now * 7) * .35; }
  pieces.forEach(p => p.userData.spin.forEach((o, i) => { if (p.userData.type === 6) o.rotation.z = now * 1.2; else o.rotation.y = now * 2 + p.userData.phase; }));
  const camR = Math.hypot(camera.position.x, camera.position.z) || 1;
  for (const c of candles) {
    const u = c.userData;
    c.position.y = u.y + Math.sin(now * .8 + u.phase) * .28;
    u.flame.scale.set(.5 + Math.sin(now * 13 + u.phase) * .05, .82 + Math.sin(now * 9 + u.phase * 3) * .1, 1);
    // hide candles that would block the view of the board
    const front = (c.position.x * camera.position.x + c.position.z * camera.position.z) / (u.r * camR);
    c.visible = !(front > .35 && u.r < camR + 7) && c.position.distanceTo(camera.position) > 6;
  }
  // open up the side of the hall that the camera is looking through
  for (const b of bays) b.visible = !(camR > 13 && (b.userData.dir[0] * camera.position.x + b.userData.dir[1] * camera.position.z) / camR > .35);
  for (const f of flames) {
    f.scale.setScalar(f.userData.size * (1 + Math.sin(now * 8 + f.position.x) * .08 + Math.sin(now * 17 + f.position.z) * .05));
    if (f.userData.orb) f.userData.orb.rotation.y = now;
  }
  sideLights.forEach((l, i) => l.intensity = game && !game.over && game.state.side === i ? 70 + Math.sin(now * 4) * 12 : 30);
  if (!paused && Math.random() < dt * 22) particle(V(rand(-11, 11), rand(-1, 7), rand(-11, 11)), Math.random() < .5 ? 0xffd27a : 0x9fc4ff, rand(.05, .13), rand(2, 5), V(rand(-.1, .1), rand(.05, .3), rand(-.1, .1)));
  renderer.render(scene, camera);
}

resize(); setCamera(0); soundLabel();
try { await Promise.race([document.fonts.load('700 38px Cinzel'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
newGame();
renderer.setAnimationLoop(frame);
$('loading').classList.add('done');
window.__magic = { get game() { return game; }, setSpeed: v => speed = v, setCamera };
</script>
</body>
</html>
